[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Astro emits dist/404.html; Netlify serves it automatically for unmatched routes.

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"

# Fingerprinted assets can be cached forever — a change produces a new filename.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Social cards are regenerated on every build and their URLs are stable, so they
# are revalidated rather than cached indefinitely.
[[headers]]
  for = "/og/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/rss.xml"
  [headers.values]
    Content-Type = "application/rss+xml; charset=utf-8"
    Cache-Control = "public, max-age=3600"

# The search index must not go stale behind a published post.
[[headers]]
  for = "/search-index.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# The CMS is authenticated, but keep it out of search results and caches.
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "public, max-age=0, must-revalidate"
